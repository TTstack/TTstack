[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/agent",
    "crates/ctl",
    "crates/cli",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
authors = ["fh <hui.fan@mail.ru>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ruc = { version = "11.0.1", features = ["cmd"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
uuid = { version = "1.26.1", features = ["v4"] }
nix = { version = "0.31.3", features = ["signal", "fs"] }
tempfile = "3.27.0"
toml = "1.1.6"
sha2 = "0.11.0"

[profile.release]
lto = true
incremental = false
overflow-checks = false
panic = "unwind"
